format_version: 2
name: "Memos"
slug: "memos"
description: "Self-hosted note-taking with Markdown notes, tags and a timeline. Data stays in SQLite on one volume."
version: "0.2.0"
app_version: "0.31.0"
category: "productivity"
subcategory: "notes"
tags: ["notes", "markdown", "memos", "knowledge-base"]
icon: "notebook-pen"
links:
  - label: "Documentation"
    url: "https://usememos.com/docs"
  - label: "GitHub"
    url: "https://github.com/usememos/memos"
upstream:
  repository: "https://github.com/usememos/memos"
  license: "MIT"
maintainers:
  - github: "camilb"
platforms: ["linux/amd64", "linux/arm64"]

standard:
  image: "ghcr.io/usememos/memos"
  tag: "0.31.0@sha256:24c2707ddd8fbd2ceaa7a61ecab86a53cdcde640b24ce572b73da14b00b5785f"
  port: 5230
  with: ["storage", "access"]
  defaults:
    auto_update_policy: "patch"

values: |
  {{#access_enabled}}
  instanceUrl: "https://{{{ hostname }}}"
  {{/access_enabled}}
